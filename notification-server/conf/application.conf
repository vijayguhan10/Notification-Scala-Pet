# =============================================================================
# Kafka Configuration
# =============================================================================
#
# We use TWO independent consumer groups:
#
# 1. DB Writer Consumer Group
#    - consumes events
#    - writes events into PostgreSQL
#
# 2. Notification Consumer Group
#    - consumes same events
#    - prepares notifications
#    - pushes notifications into RabbitMQ
#
# Both groups consume the SAME Kafka topic independently.
# Kafka tracks offsets separately for each consumer group.
#
# =============================================================================

kafka {

  bootstrapServers = "localhost:29092"

  topic = "user-activity-events"

  clientId = "notification-server"

  # ---------------------------------------------------------------------------
  # DB Writer Consumer
  # ---------------------------------------------------------------------------

  dbWriter {

    groupId = "notification-db-writer-group"

    pollTimeoutMillis = 1000

    batchSize = 500

    enableAutoCommit = false

    autoOffsetReset = "earliest"

    maxPollRecords = 500
  }

  # ---------------------------------------------------------------------------
  # Notification / RabbitMQ Consumer
  # ---------------------------------------------------------------------------

  notification {

    groupId = "notification-rabbitmq-group"

    pollTimeoutMillis = 1000

    batchSize = 500

    enableAutoCommit = false

    autoOffsetReset = "earliest"

    maxPollRecords = 500
  }

  # Shared Kafka Fetch Config

  fetchMaxBytes = 5242880

  maxPartitionFetchBytes = 1048576

  fetchMinBytes = 1

  fetchMaxWaitMs = 500

  sessionTimeoutMs = 45000

  heartbeatIntervalMs = 3000
  maxPollIntervalMs = 300000
}

# =============================================================================
# Event Stream Generator
# =============================================================================

eventStream {

  ratePerSecond = 2000

  batchEveryMillis = 1000
}

# =============================================================================
# Play HTTP Server
# =============================================================================

play.server.http.port = 7000

# =============================================================================
# PostgreSQL + Slick
# =============================================================================

slick.dbs.default.profile = "slick.jdbc.PostgresProfile$"

slick.dbs.default.db {

  driver = "org.postgresql.Driver"

  url = "jdbc:postgresql://localhost:5432/notification_db"

  user = "postgres"

  password = "21125aaJV"

  connectionPool = "HikariCP"

  numThreads = 20

  maxConnections = 20
}

# =============================================================================
# Flyway Migration
# =============================================================================

flyway.url = "jdbc:postgresql://localhost:5432/notification_db"

flyway.user = "postgres"

flyway.password = "21125aaJV"

flyway.locations = ["classpath:db/migration"]