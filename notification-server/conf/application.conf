# =============================================================================
# Play Modules
# =============================================================================

play.modules.enabled += "modules.AppModule"
play.modules.enabled += "modules.DatabaseModule"

# =============================================================================
# Kafka Configuration
# =============================================================================

kafka {

  # ---------------------------------------------------------------------------
  # Core Kafka
  # ---------------------------------------------------------------------------

  bootstrapServers = "localhost:29092"

  topic = "user-activity-events"

  clientId = "notification-server"

  # ---------------------------------------------------------------------------
  # Producer Reliability
  # ---------------------------------------------------------------------------

  acks = "all"

  retries = 10

  retryBackoffMs = 1000

  enableIdempotence = true

  requestTimeoutMs = 30000

  deliveryTimeoutMs = 120000

  compressionType = "snappy"

  # ---------------------------------------------------------------------------
  # DB Writer Consumer
  # ---------------------------------------------------------------------------

  dbWriter {

    clientId = "notification-db-consumer"

    groupId = "notification-db-writer-group"

    groupInstanceId = "notification-db-instance-1"

    pollTimeoutMillis = 1000

    processingBatchSize = 1

    # Backward compatibility
    batchSize = 1

    enableAutoCommit = false

    autoOffsetReset = "earliest"

    maxPollRecords = 1

    isolationLevel = "read_committed"
  }

  # ---------------------------------------------------------------------------
  # Notification Consumer
  # ---------------------------------------------------------------------------

  notificationWriter {

    clientId = "notification-consumer"

    groupId = "notification-consumer-group"

    groupInstanceId = "notification-instance-1"

    pollTimeoutMillis = 1000

    processingBatchSize = 1

    # Backward compatibility
    batchSize = 1

    enableAutoCommit = false

    autoOffsetReset = "earliest"

    maxPollRecords = 1

    isolationLevel = "read_committed"
  }

  # ---------------------------------------------------------------------------
  # Kafka Fetch / Session Tuning
  # ---------------------------------------------------------------------------

  fetchMaxBytes = 5242880

  maxPartitionFetchBytes = 1048576

  fetchMinBytes = 1

  fetchMaxWaitMs = 500

  sessionTimeoutMs = 45000

  heartbeatIntervalMs = 3000

  maxPollIntervalMs = 300000

  connectionsMaxIdleMs = 540000
}

# =============================================================================
# Event Stream Generator
# =============================================================================

eventStream {

  ratePerSecond = 1

  batchEveryMillis = 1000
}

# =============================================================================
# Play HTTP Server
# =============================================================================

play.server.http.port = 7000

# =============================================================================
# PostgreSQL + Slick
# =============================================================================

slick.dbs.default.profile =
  "slick.jdbc.PostgresProfile$"

slick.dbs.default.db {

  driver = "org.postgresql.Driver"

  url =
    "jdbc:postgresql://localhost:5432/notification_db"

  user = "postgres"

  password = "21125aaJV"

  connectionPool = "HikariCP"

  numThreads = 20

  maxConnections = 20
}

# =============================================================================
# Flyway Migration
# =============================================================================

flyway.url =
  "jdbc:postgresql://localhost:5432/notification_db"

flyway.user = "postgres"

flyway.password = "21125aaJV"

flyway.locations = [
  "classpath:db/migration",
  "filesystem:conf/db/migration"
]

# DEV ONLY:
# Drops and reruns migrations on startup
# Turn OFF in production

flyway.cleanOnStart = false

# =============================================================================
# RabbitMQ
# =============================================================================

rabbitmq.host = "localhost"

rabbitmq.port = 5672

rabbitmq.username = "guest"

rabbitmq.password = "guest"

rabbitmq.exchange = "notification.exchange"

rabbitmq.queue = "notification.queue"

rabbitmq.routingKey = "notification.created"

rabbitmq.dlq = "notification.dlq"

# =============================================================================
# Notification Dispatcher
# =============================================================================

dispatcher.batchSize = 100

dispatcher.intervalMillis = 1000

# =============================================================================
# Notification Outbound Service
# =============================================================================

notification.outboundEndpoint =
  "http://localhost:7000/outbound/notify"