# https://www.playframework.com/documentation/latest/Configuration

kafka {
	# Use the Docker-exposed host listener (see docker-compose.yaml)
	bootstrapServers = "localhost:29092"
	topic = "user-activity-events"
	clientId = "notification-server"
}

eventStream {
	ratePerSecond = 2000
	batchEveryMillis = 10
}

# Play HTTP server
# Default Play port is 9000; use 7000 to avoid local conflicts.
play.server.http.port = 7000
